<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>SKAGRI</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f6faf3;--card:#fff;--tx:#17301c;--mu:#5b7060;--g:#2e7d32;--y:#f9c823;--bd:#dbe7d6}
@media(prefers-color-scheme:dark){:root{--bg:#10190f;--card:#192618;--tx:#e8f2e4;--mu:#9bb09b;--g:#5fbf65;--bd:#2c3f2b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif}
header{background:var(--g);color:#fff;padding:14px 16px}header b{font-size:22px}header small{display:block;opacity:.9}
nav{display:flex;gap:6px;padding:8px;overflow-x:auto;background:var(--card);border-bottom:2px solid var(--y)}
nav button{flex:none;border:1px solid var(--bd);background:none;color:var(--tx);padding:9px 14px;border-radius:20px;font-size:15px}
nav button.on{background:var(--g);color:#fff;border-color:var(--g)}
main{padding:14px;max-width:760px;margin:auto}.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
input,select,textarea{width:100%;padding:11px;margin:5px 0;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.b{display:block;width:100%;text-align:center;text-decoration:none;background:var(--g);color:#fff;border:0;padding:12px;border-radius:8px;font-size:16px;margin-top:6px}.del{background:#b3261e}
.mu{color:var(--mu);font-size:14px}.p{color:var(--g);font-weight:700}.tag{background:var(--y);color:#222;border-radius:6px;padding:2px 8px;font-size:12px}
</style></head><body>
<header><b>🌱 SKAGRI</b><small>Le numérique au service de l’agriculture mondiale</small></header>
<nav id="nav"></nav><main id="m"></main>
<script>
const sb=supabase.createClient("https://latnrvnlvavhxregyxwz.supabase.co","sb_publishable_kdcAyGBHTl1I_nFvk2h_6w_xb0C_8m8");
const CATS=["Céréales","Légumes et fruits","Légumineuses","Semences","Engrais et intrants","Matériel","Bétail","Services"];
const ROLES=["Agriculteur / producteur","Éleveur","Acheteur / grossiste","Fournisseur d’intrants","Vendeur de matériel","Transporteur","Conseiller agricole","Coopérative / entreprise"];
const KINDS=["Dépense","Recette"];
let me=null,tab="market",L=[],E=[],P={},q="",fc="";
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const g=id=>$("#"+id).value.trim(),fail=e=>alert("Erreur : "+(e.message||e));
function nav(){const t=[["market","Annonces"],["post","Publier"],["farm","Mon exploitation"],["acc",me?"Compte":"Connexion"]];
$("#nav").innerHTML=t.map(([k,l])=>`<button class="${k==tab?"on":""}" onclick="go('${k}')">${l}</button>`).join("")}
async function go(t){tab=t;nav();await load();render()}
async function load(){const r=await sb.from("listings").select("*").order("created_at",{ascending:false});L=r.data||[];
if(me){const e=await sb.from("entries").select("*").order("created_at",{ascending:false});E=e.data||[];const p=await sb.from("profiles").select("*").eq("id",me.id).maybeSingle();P=p.data||{}}}
function wa(i){const d=(i.contact||"").replace(/\D/g,"");if(!d)return"";const n=d.length==8?"226"+d:d;
return `<div>📞 ${esc(i.contact)}</div><a class="b" target="_blank" rel="noopener" href="https://wa.me/${n}?text=${encodeURIComponent("Bonjour, je suis intéressé par votre annonce SKAGRI : "+i.title)}">💬 Contacter sur WhatsApp</a>`}
function need(){return `<div class="c">Connectez-vous pour utiliser cette partie. <button class="b" onclick="go('acc')">Connexion / Inscription</button></div>`}
function render(){const m=$("#m");
if(tab=="market"){const r=L.filter(i=>(!fc||i.cat==fc)&&(!q||(i.title+i.city+i.cat).toLowerCase().includes(q.toLowerCase())));
m.innerHTML=`<h2>Annonces</h2><input id="q" placeholder="Rechercher (maïs, engrais…)" value="${esc(q)}"><select id="fc"><option value="">Toutes catégories</option>${CATS.map(c=>`<option ${c==fc?"selected":""}>${c}</option>`).join("")}</select>`+
(r.length?r.map(i=>`<div class="c"><b>${esc(i.title)}</b><div class="p">${esc(i.price)}</div><div class="mu">${esc(i.cat)} · ${esc(i.city)}, ${esc(i.country)}</div>${i.descr?`<p>${esc(i.descr)}</p>`:""}${wa(i)}${me&&me.id==i.owner?`<button class="b del" onclick="delL(${i.id})">Supprimer mon annonce</button>`:""}</div>`).join(""):`<p class="mu">Aucune annonce pour le moment. Soyez le premier à publier !</p>`);
$("#q").oninput=e=>{q=e.target.value;render();const x=$("#q");x.focus();x.setSelectionRange(q.length,q.length)};$("#fc").onchange=e=>{fc=e.target.value;render()}}
if(tab=="post")m.innerHTML=!me?need():`<h2>Publier une annonce</h2><div class="c"><input id="t" placeholder="Titre"><select id="c">${CATS.map(c=>`<option>${c}</option>`).join("")}</select><input id="pr" placeholder="Prix (ex. 2 000 FCFA/kg)"><input id="co" placeholder="Pays" value="Burkina Faso"><input id="ci" placeholder="Ville"><textarea id="d" rows="3" placeholder="Description, quantité, conditions"></textarea><input id="ct" placeholder="WhatsApp (ex. 70 12 34 56 ou +226 70 12 34 56)"><button class="b" onclick="pub()">Publier</button></div>`;
if(tab=="farm")farm();
if(tab=="acc")m.innerHTML=me?`<h2>Mon compte</h2><div class="c">Connecté : <b>${esc(me.email)}</b><button class="b del" onclick="out()">Se déconnecter</button></div>`:`<h2>Connexion / Inscription</h2><div class="c"><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Mot de passe (6 caractères minimum)"><button class="b" onclick="login()">Se connecter</button><button class="b" style="background:var(--y);color:#222" onclick="signup()">Créer un compte</button><p class="mu">À l’inscription, vous recevrez un email : appuyez sur le lien pour confirmer, puis connectez-vous.</p></div>`}
function farm(){const m=$("#m");if(!me){m.innerHTML=need();return}
const s=k=>E.filter(e=>e.kind==k).reduce((a,e)=>a+(+e.amount||0),0),rec=s("Recette"),dep=s("Dépense");
m.innerHTML=`<h2>Mon exploitation</h2><div class="c"><b>Mon profil</b><input id="pn" placeholder="Nom / exploitation" value="${esc(P.name)}"><select id="pr2">${ROLES.map(r=>`<option ${r==P.role?"selected":""}>${r}</option>`).join("")}</select><input id="pc" placeholder="Pays / région" value="${esc(P.place||"Burkina Faso")}"><button class="b" onclick="saveP()">Enregistrer le profil</button></div>
<div class="c"><b>Bilan</b><div>Recettes : <span class="p">${rec.toLocaleString("fr")} FCFA</span></div><div>Dépenses : ${dep.toLocaleString("fr")} FCFA</div><div>Marge : <b>${(rec-dep).toLocaleString("fr")} FCFA</b></div></div>
<div class="c"><b>Ajouter</b><select id="ek">${KINDS.map(k=>`<option>${k}</option>`).join("")}</select><input id="el" placeholder="Libellé (ex. achat engrais, vente maïs)"><input id="ea" type="number" placeholder="Montant en FCFA"><input id="ed" type="date"><button class="b" onclick="addE()">Ajouter</button></div>`+
E.map(e=>`<div class="c"><b>${esc(e.label)}</b> <span class="tag">${esc(e.kind)}</span><div class="mu">${esc(e.date||"")} · ${(+e.amount||0).toLocaleString("fr")} FCFA</div><button class="b del" onclick="delE(${e.id})">Supprimer</button></div>`).join("")}
async function pub(){if(!g("t")||!g("pr")||!g("ci"))return alert("Titre, prix et ville obligatoires.");
const r=await sb.from("listings").insert({title:g("t"),cat:g("c"),price:g("pr"),country:g("co"),city:g("ci"),descr:g("d"),contact:g("ct")});if(r.error)return fail(r.error);alert("Annonce publiée !");go("market")}
async function delL(id){if(!confirm("Supprimer cette annonce ?"))return;const r=await sb.from("listings").delete().eq("id",id);if(r.error)return fail(r.error);go("market")}
async function saveP(){const r=await sb.from("profiles").upsert({id:me.id,name:g("pn"),role:g("pr2"),place:g("pc")});if(r.error)return fail(r.error);alert("Profil enregistré");load()}
async function addE(){if(!g("el")||g("ea")==="")return alert("Libellé et montant obligatoires.");const r=await sb.from("entries").insert({kind:g("ek"),label:g("el"),amount:+g("ea"),date:g("ed")||null});if(r.error)return fail(r.error);go("farm")}
async function delE(id){if(!confirm("Supprimer cette ligne ?"))return;const r=await sb.from("entries").delete().eq("id",id);if(r.error)return fail(r.error);go("farm")}
async function signup(){if(!g("em")||g("pw").length<6)return alert("Email et mot de passe (6 caractères min.) requis.");const r=await sb.auth.signUp({email:g("em"),password:g("pw")});if(r.error)return fail(r.error);alert("Compte créé. Ouvrez l’email reçu et appuyez sur le lien de confirmation, puis connectez-vous.")}
async function login(){const r=await sb.auth.signInWithPassword({email:g("em"),password:g("pw")});if(r.error)return fail(r.error)}
async function out(){await sb.auth.signOut()}
sb.auth.onAuthStateChange((ev,s)=>{me=s?s.user:null;if(ev=="SIGNED_IN"||ev=="SIGNED_OUT"||ev=="INITIAL_SESSION"){if(ev=="SIGNED_IN")tab="market";if(ev=="SIGNED_OUT"){E=[];P={}}setTimeout(()=>go(tab),0)}});
nav();load().then(render);
</script></body></html>
